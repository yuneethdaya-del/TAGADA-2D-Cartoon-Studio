<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAGADA - 2D Cartoon Studio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #151525;
            color: white;
            text-align: center;
        }
        header {
            background: #252545;
            padding: 25px;
        }
        h1 {
            color: #ffcc55;
            font-size: 36px;
        }
        .studio {
            padding: 40px 20px;
        }
        .panel {
            background: #252545;
            padding: 25px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 15px;
        }
        button {
            background: #ffcc55;
            color: #151525;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>TAGADA</h1>
        <p>My 2D Cartoon Animation Studio</p>
    </header>

    <main class="studio">
        <div class="panel">
            <h2>Welcome to TAGADA Studio</h2>
            <p>Create your own 2D cartoon stories.</p>
            <button onclick="alert('Cartoon Studio Coming Soon!')">
                Start Creating
            </button>
        </div>

        <div class="panel">
            <h2>Our Features</h2>
            <p>Character Creator</p>
            <p>Dress Changer</p>
            <p>Background Creator</p>
            <p>Animation Editor</p>
            <p>Video Export</p>
        </div>
    </main>
</body>
